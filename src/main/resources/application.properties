# =======================================================
# Core Application Settings
# =======================================================
spring.application.name=${SPRING_APPLICATION_NAME}
server.port=${SERVER_PORT}

# =======================================================
# Database & Connection Pool Configuration
# =======================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# Hikari Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# =======================================================
# JPA & Hibernate Settings
# =======================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT}

# =======================================================
# Security & External Services
# =======================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ISSUER_URI}
user.service.url=${ISSUER_URI}
# external.auth.url=${EXTERNAL_AUTH_URL}

# =======================================================
# Caching (Caffeine)
# =======================================================
spring.cache.type=caffeine
spring.cache.cache-names=users,roles,allUsers
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m

# Sprint End & Task Handling
sprint.prompt.window.hours=24
# Scheduler runs every minute (0 * * * * *)
sprint.scheduler.cron=0 * * * * *

# =======================================================
# Logging Configuration
# =======================================================
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.modelmapper=DEBUG

# =======================================================
# Actuator & Health Endpoints
# =======================================================
management.endpoint.mappings.enabled=true
management.endpoints.web.exposure.include=health,info,mappings
management.endpoint.health.show-details=always